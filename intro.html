<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8dce9">
  <title>A Little Surprise 🎀</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow: hidden;
      display: grid; place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      color: #75465f;
      background:
        radial-gradient(circle at 15% 15%, #fff8fc 0 9%, transparent 28%),
        radial-gradient(circle at 85% 80%, #dcecff 0 8%, transparent 30%),
        linear-gradient(135deg, #f9dce9, #e8e9ff 55%, #fce8f1);
    }
    .glow {
      position: fixed; width: 270px; height: 270px; border-radius: 50%;
      background: #fff; filter: blur(70px); opacity: .48; pointer-events: none;
    }
    .glow.one { top: -100px; left: -80px; }
    .glow.two { bottom: -110px; right: -70px; background: #b9d7ff; }
    .card {
      position: relative; z-index: 1; width: min(90%, 430px);
      padding: 38px 25px; text-align: center; border-radius: 28px;
      background: rgba(255,255,255,.68); border: 1px solid rgba(255,255,255,.9);
      box-shadow: 0 18px 55px rgba(126,76,111,.15);
      backdrop-filter: blur(12px);
    }
    .tag { font: 12px Arial, sans-serif; letter-spacing: 3px; text-transform: uppercase; color: #a66d8c; }
    h1 { margin: 15px 0 10px; font-size: clamp(30px, 8vw, 43px); color: #b44f83; }
    p { line-height: 1.7; font-size: 16px; margin: 10px 0 24px; }
    button {
      border: 0; border-radius: 999px; padding: 14px 24px; cursor: pointer;
      color: white; font-size: 15px; font-weight: bold;
      background: linear-gradient(110deg, #df78a9, #9a9ee8);
      box-shadow: 0 8px 20px rgba(177,104,159,.25);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    button:active { transform: scale(.96); }
    button:hover { box-shadow: 0 11px 25px rgba(177,104,159,.35); }
    .arrow { display: block; font-size: 48px; margin: 15px auto 8px; cursor: pointer; border: 0; background: none; box-shadow: none; padding: 5px; }
    .arrow:hover { box-shadow: none; transform: translateY(-3px); }
    .hidden { display: none; }
    .heart {
      position: fixed; z-index: 3; pointer-events: none; font-size: 22px;
      animation: floatUp 2.2s ease-out forwards;
    }
    @keyframes floatUp {
      from { transform: translateY(0) scale(.6) rotate(0); opacity: 1; }
      to { transform: translateY(-75vh) scale(1.4) rotate(25deg); opacity: 0; }
    }
    .small { font: 12px Arial, sans-serif; color: #a47b91; margin-top: 22px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="glow one"></div><div class="glow two"></div>
  <main class="card">
    <div class="tag">A tiny surprise awaits</div>
    <section id="first">
      <div class="arrow" aria-hidden="true">🏹💗</div>
      <h1>Hey, Ekra! 🎀</h1>
      <p>There's a little birthday surprise waiting for you.<br>Ready to see it?</p>
      <button id="shoot">Shoot the Arrow 💘</button>
    </section>
    <section id="second" class="hidden">
      <div style="font-size:48px">💗✨🌸</div>
      <h1>A special surprise<br>for a special person</h1>
      <p>Made with care, just to make your birthday a little sweeter.</p>
      <button id="open">Open your surprise 🎁</button>
    </section>
    <div class="small">Made with birthday wishes ♡</div>
  </main>
  <script>
    const first = document.getElementById('first');
    const second = document.getElementById('second');

    function heartBurst() {
      const symbols = ['💗', '💕', '♡', '✨', '🌸', '🎀'];
      for (let i = 0; i < 28; i++) {
        const heart = document.createElement('span');
        heart.className = 'heart';
        heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        heart.style.left = (8 + Math.random() * 84) + 'vw';
        heart.style.top = (55 + Math.random() * 25) + 'vh';
        heart.style.animationDelay = (Math.random() * .45) + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 2800);
      }
    }

    document.getElementById('shoot').addEventListener('click', () => {
      heartBurst();
      first.classList.add('hidden');
      second.classList.remove('hidden');
    });

    document.getElementById('open').addEventListener('click', () => {
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
